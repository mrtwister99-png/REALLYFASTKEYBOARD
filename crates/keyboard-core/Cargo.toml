[package]
name = "keyboard-core"
version = "1.0.0"
edition = "2021"
description = "RustBoard - jadro klavesnice (swipe decoder, slovnik, predikce, nastaveni, uceni)"
license = "GPL-2.0-or-later"

[lib]
name = "keyboard_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "build-dict"
path = "src/bin/build_dict.rs"

[[bench]]
name = "core"
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
fst = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
